name: Build Dalati TV APK

on:
  workflow_dispatch:
  push:
    branches: [ dalati-tv-v26-preview ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Dalati TV v28 source
        run: |
          set -euo pipefail
          ZIP="CleanYourTV-DalatiTV-v28-Verified-CI-Source.zip"
          test -s "$ZIP"
          mkdir -p source
          unzip -q "$ZIP" -d source
          test -f source/CleanYourTV-Independent/settings.gradle
          test -f source/CleanYourTV-Independent/app/build.gradle
          test -f source/CleanYourTV-Independent/app/src/main/AndroidManifest.xml
          test -f source/CleanYourTV-Independent/app/src/main/java/ae/cleanyourtv/independent/MainActivity.java
          test -s source/CleanYourTV-Independent/app/src/main/res/drawable-nodpi/ajman_cinematic.jpg

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK and install platform
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME is not set on the GitHub runner}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: source/CleanYourTV-Independent
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK package and launcher manifest
        working-directory: source/CleanYourTV-Independent
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -Fq "package: name='ae.cleanyourtv.independent'" /tmp/apk-badging.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > /tmp/apk-manifest.txt
          grep -Fq 'android.intent.category.HOME' /tmp/apk-manifest.txt
          grep -Fq 'android.intent.category.DEFAULT' /tmp/apk-manifest.txt
          grep -Fq 'android.intent.category.LEANBACK_LAUNCHER' /tmp/apk-manifest.txt
          sha256sum "$APK" | tee app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dalati-TV-v28-debug-APK
          path: |
            source/CleanYourTV-Independent/app/build/outputs/apk/debug/app-debug.apk
            source/CleanYourTV-Independent/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
