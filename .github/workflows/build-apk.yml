# Dalati TV verified Android TV build workflow
name: Build Dalati TV APK v21

on:
  workflow_dispatch:
  push:
    branches: [ dalati-tv-v26-preview ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and patch Dalati TV v19 source
        run: |
          set -euo pipefail
          ZIP="CleanYourTV-DalatiTV-v30-Verified-CI-Source.zip"
          test -s "$ZIP"
          mkdir -p source
          unzip -q "$ZIP" -d source
          test -f source/CleanYourTV-Independent/settings.gradle
          test -f source/CleanYourTV-Independent/app/build.gradle
          test -f source/CleanYourTV-Independent/app/src/main/AndroidManifest.xml
          test -f source/CleanYourTV-Independent/app/src/main/java/ae/cleanyourtv/independent/MainActivity.java
          test -s source/CleanYourTV-Independent/app/src/main/res/drawable-nodpi/ajman_cinematic.jpg
          python3 patches/apply-dalati-tv-v18.py
          python3 patches/apply-dalati-tv-v20.py
          python3 patches/apply-dalati-tv-v21.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK and install platform
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME is not set on the GitHub runner}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: source/CleanYourTV-Independent
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Android TV emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: tv_1080p
          disable-animations: false
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -memory 4096 -gpu swiftshader_indirect
          script: >-
            set -euo pipefail &&
            test -s source/CleanYourTV-Independent/app/build/outputs/apk/debug/app-debug.apk &&
            adb wait-for-device &&
            for i in $(seq 1 90); do adb shell cmd package list packages >/dev/null 2>&1 && break; sleep 2; done &&
            adb shell cmd package list packages >/dev/null &&
            adb install -r source/CleanYourTV-Independent/app/build/outputs/apk/debug/app-debug.apk &&
            adb shell am start -n ae.cleanyourtv.independent/.MainActivity &&
            sleep 15 &&
            adb shell pidof ae.cleanyourtv.independent &&
            adb shell screencap -p /sdcard/dalati-home.png &&
            adb pull /sdcard/dalati-home.png dalati-home-emulator.png &&
            test -s dalati-home-emulator.png

      - name: Upload Android TV emulator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: Dalati-TV-v21-emulator-smoke
          path: dalati-home-emulator.png
          if-no-files-found: error

      - name: Verify APK package and launcher manifest
        working-directory: source/CleanYourTV-Independent
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -Fq "package: name='ae.cleanyourtv.independent' versionCode='21' versionName='0.21.0-preview'" /tmp/apk-badging.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > /tmp/apk-manifest.txt
          grep -Fq 'android.intent.category.HOME' /tmp/apk-manifest.txt
          grep -Fq 'android.intent.category.DEFAULT' /tmp/apk-manifest.txt
          grep -Fq 'android.intent.category.LEANBACK_LAUNCHER' /tmp/apk-manifest.txt
          sha256sum "$APK" | tee app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dalati-TV-v21-debug-APK
          path: |
            source/CleanYourTV-Independent/app/build/outputs/apk/debug/app-debug.apk
            source/CleanYourTV-Independent/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload patched source for full review
        uses: actions/upload-artifact@v4
        with:
          name: Dalati-TV-v21-patched-source-review
          path: source/CleanYourTV-Independent/
          if-no-files-found: error
